<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="refresh" content="30">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>黑灯工厂 · 可观测看板</title>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --border: #30363d;
    --fg: #e6edf3; --dim: #8b949e;
    --red: #f85149; --amber: #d29922; --green: #3fb950; --blue: #58a6ff;
  }
  * { box-sizing: border-box; }
  body { background: var(--bg); color: var(--fg); margin: 0;
         font: 13px/1.45 "SFMono-Regular", Consolas, "Liberation Mono", "Noto Sans CJK SC", monospace; }
  .wrap { padding: 12px 16px 24px; }
  h1 { font-size: 16px; margin: 0 0 2px; }
  h2 { font-size: 13px; margin: 0 0 6px; color: var(--blue); border-bottom: 1px solid var(--border); padding-bottom: 4px; }
  .sub { color: var(--dim); font-size: 12px; margin-bottom: 10px; }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 6px;
           padding: 10px 12px; margin-bottom: 12px; min-width: 0; }
  .grid2 { display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: 12px; }
  @media (max-width: 1100px) { .grid2 { grid-template-columns: 1fr; } }
  .scrollx { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; }
  th, td { border: 1px solid var(--border); padding: 3px 7px; text-align: right; white-space: nowrap; }
  th { color: var(--dim); font-weight: normal; background: #1c2129; }
  td.l, th.l { text-align: left; }
  .bar { position: relative; background: #21262d; border: 1px solid var(--border); height: 14px;
         width: 130px; display: inline-block; vertical-align: middle; }
  .bar > i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--green); }
  .bar > span { position: absolute; width: 100%; text-align: center; font-size: 10px;
                line-height: 14px; color: var(--fg); }
  .lamp { display: inline-block; border-radius: 4px; padding: 1px 7px; margin: 2px 4px 2px 0;
          font-size: 12px; border: 1px solid; }
  .red   { color: var(--red);   border-color: var(--red);   background: rgba(248,81,73,.12); }
  .amber { color: var(--amber); border-color: var(--amber); background: rgba(210,153,34,.12); }
  .ok    { color: var(--green); border-color: var(--green); background: rgba(63,185,80,.10); }
  .dim   { color: var(--dim); }
  .big   { font-size: 15px; font-weight: bold; }
  .alarm-line { padding: 3px 0; border-bottom: 1px dashed var(--border); }
  .alarm-line:last-child { border-bottom: none; }
  .diskbar { width: 130px; height: 12px; background: #21262d; border: 1px solid var(--border);
             display: inline-block; vertical-align: middle; }
  .diskbar > i { display: block; height: 100%; background: var(--green); }
  .warn > i { background: var(--amber) !important; }
  .crit > i { background: var(--red) !important; }
  #err { color: var(--amber); }
</style>
</head>
<body>
<div class="wrap">
  <h1>黑灯工厂 · 可观测看板</h1>
  <div class="sub" id="head">数据加载中…（30s 自动刷新）</div>
  <div class="grid2">
    <div>
      <div class="panel">
        <h2>产线矩阵（档 × 档案）</h2>
        <div id="matrix" class="scrollx"><span class="dim">等待数据…</span></div>
      </div>
      <div class="panel">
        <h2>成本区（各档案累计 tokens / runs）</h2>
        <div id="cost" class="dim">等待数据…</div>
      </div>
    </div>
    <div>
      <div class="panel">
        <h2>安灯区（异常分级报警）</h2>
        <div id="alarms" class="dim">等待数据…</div>
      </div>
      <div class="panel">
        <h2>资源区（anolis）</h2>
        <div id="res" class="dim">等待数据…</div>
      </div>
    </div>
  </div>
</div>
<script>
"use strict";
function h(tag, cls, text) {
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined && text !== null) e.textContent = String(text);
  return e;
}
function humanTokens(n) {
  if (n === null || n === undefined) return "-";
  if (n >= 1e9) return (n / 1e9).toFixed(2) + "G";
  if (n >= 1e6) return (n / 1e6).toFixed(2) + "M";
  if (n >= 1e3) return (n / 1e3).toFixed(1) + "k";
  return String(n);
}
function el(id) { return document.getElementById(id); }

function bar(resolved, total) {
  var pct = total > 0 ? Math.min(100, resolved * 100 / total) : 0;
  var d = h("span", "bar");
  var i = h("i"); i.style.width = pct.toFixed(1) + "%";
  d.appendChild(i);
  d.appendChild(h("span", null, resolved + "/" + total));
  return d;
}

function renderAlarms(data) {
  var box = el("alarms");
  box.textContent = "";
  var al = (data && data.alarms) || [];
  var nRed = al.filter(function (x) { return x.level === "red"; }).length;
  var nAmb = al.filter(function (x) { return x.level === "amber"; }).length;
  var head = h("div", null);
  head.appendChild(h("span", nRed ? "lamp red big" : "lamp ok", "红 " + nRed));
  head.appendChild(h("span", nAmb ? "lamp amber big" : "lamp ok", "黄 " + nAmb));
  head.appendChild(h("span", "dim", "  规则 A0-A7 见 tools/factory-watch.py"));
  box.appendChild(head);
  if (!al.length) {
    box.appendChild(h("div", "dim", "当前无报警。"));
    return;
  }
  al.forEach(function (a) {
    var line = h("div", "alarm-line");
    line.appendChild(h("span", a.level === "red" ? "lamp red" : "lamp amber",
                       (a.level === "red" ? "红灯 " : "黄灯 ") + a.code));
    line.appendChild(h("div", null, a.message));
    line.appendChild(h("div", "dim", "since " + a.since));
    box.appendChild(line);
  });
}

function renderMatrix(data) {
  var box = el("matrix");
  box.textContent = "";
  var arms = (data && data.arms) || [];
  var tiers = ["D1", "D2", "D3", "F2"];
  var profs = [];
  arms.forEach(function (a) {
    if (profs.indexOf(a.profile) < 0) profs.push(a.profile);
  });
  var t = document.createElement("table");
  var tr = h("tr");
  tr.appendChild(h("th", "l", "档 \\ 档案"));
  profs.forEach(function (p) { tr.appendChild(h("th", null, p)); });
  t.appendChild(tr);
  var plan = (data && data.plan && data.plan.tiers) || {};
  tiers.forEach(function (tier) {
    var tr = h("tr");
    tr.appendChild(h("td", "l", tier + "（目标 " + (plan[tier] || 0) + "）"));
    profs.forEach(function (p) {
      var a = arms.filter(function (x) { return x.tier === tier && x.profile === p; })[0];
      var td = h("td");
      if (!a) { td.appendChild(h("span", "dim", "-")); tr.appendChild(td); return; }
      if (!a.exists) {
        td.appendChild(h("span", "dim", "目录未创建"));
        tr.appendChild(td);
        return;
      }
      var total = plan[tier] || 0;
      var row = h("div");
      row.appendChild(bar(a.resolved_tasks, total));
      td.appendChild(row);
      var info = h("div", null,
        "行 " + a.n_total + " · 过 " + a.n_reward_true +
        " · rf " + a.n_run_failed + " · 拦 " + a.n_blocked +
        " · +" + a.rows_10m + "/10m");
      if (a.n_run_failed > 0) info.className = "";
      td.appendChild(info);
      var extra = [];
      if (a.avg_turns !== null && a.avg_turns !== undefined) extra.push("turns " + a.avg_turns);
      if (a.avg_wall_ms) extra.push(Math.round(a.avg_wall_ms / 1000) + "s");
      if (extra.length) td.appendChild(h("div", "dim", extra.join(" · ")));
      tr.appendChild(td);
    });
    t.appendChild(tr);
  });
  box.appendChild(t);
  var tt = (data && data.totals) || {};
  box.appendChild(h("div", "sub",
    "合计：行 " + (tt.n_total || 0) + "，reward=true " + (tt.n_reward_true || 0) +
    "，run_failed " + (tt.n_run_failed || 0) + "，最近10分钟 +" + (tt.rows_10m || 0) + " 行"));
}

function renderRes(data) {
  var box = el("res");
  box.textContent = "";
  var an = (data && data.anolis) || {};
  if (!an.ok) {
    box.appendChild(h("div", null, h("span", "lamp amber", "anolis 巡检失败")));
    box.appendChild(h("div", "dim", String(an.error || "未知原因")));
    return;
  }
  Object.keys(an.disk || {}).sort().forEach(function (m) {
    var d = an.disk[m];
    var line = h("div", null);
    line.appendChild(h("span", null, m + " "));
    var db = h("span", "diskbar" + (d.use_pct > 85 ? " crit" : d.use_pct > 75 ? " warn" : ""));
    var i = h("i"); i.style.width = d.use_pct + "%"; db.appendChild(i);
    line.appendChild(db);
    line.appendChild(h("span", null, " " + d.use_pct + "%（余 " + humanTokens(Number(d.avail) * 1024) + "）"));
    box.appendChild(line);
  });
  var imgs = an.sweb_images, target = an.image_target || 120;
  var imgLine = h("div", null);
  imgLine.appendChild(h("span", imgs !== null && imgs < target ? "lamp amber" : "lamp ok",
                        "sweb.eval 镜像 " + imgs + "/" + target + "（黄=未达标，停滞才报警 A7）"));
  box.appendChild(imgLine);
  box.appendChild(h("div", null,
    "ollama " + (an.ollama === "ok" ? "ok" : an.ollama) +
    (an.load ? "  load " + an.load.m1 + " / " + an.load.m5 + " / " + an.load.m15 : "")));
  var sc = (data && data.scheduler) || {};
  var sLine = h("div", null);
  if (sc.alive) {
    sLine.appendChild(h("span", "lamp ok", "调度器存活 pid " + (sc.pids || []).join(",")));
    var sm = sc.summary || {};
    sLine.appendChild(h("div", "dim",
      "running " + sm.running + " · done " + sm.done + " · failed " + sm.failed +
      " · partial " + sm.partial + " · pending " + sm.pending +
      "（状态龄 " + sc.mtime_age_s + "s）"));
  } else {
    sLine.appendChild(h("span", "lamp red", "调度器失联"));
  }
  box.appendChild(sLine);
  var rl = (data && data.relay) || {};
  var relayLine = h("div", null);
  relayLine.appendChild(h("span", rl.consecutive_failures >= 3 ? "lamp amber" : "lamp ok",
                          "中继连败 " + rl.consecutive_failures + "（≥3 报警 A5）"));
  box.appendChild(relayLine);
}

function renderCost(data) {
  var box = el("cost");
  box.textContent = "";
  var cost = (data && data.cost) || [];
  var t = document.createElement("table");
  var tr = h("tr");
  ["档案", "runs", "tokens_in", "tokens_out", "cache_read"].forEach(function (x, i) {
    tr.appendChild(h("th", i ? null : "l", x));
  });
  t.appendChild(tr);
  cost.forEach(function (c) {
    var tr = h("tr");
    tr.appendChild(h("td", "l", c.profile));
    tr.appendChild(h("td", null, c.runs));
    tr.appendChild(h("td", null, humanTokens(c.tokens_in)));
    tr.appendChild(h("td", null, humanTokens(c.tokens_out)));
    tr.appendChild(h("td", null, humanTokens(c.tokens_cache)));
    t.appendChild(tr);
  });
  box.appendChild(t);
}

function render(data) {
  el("head").textContent = "快照 " + (data && data.ts) + "  ·  30s 自动刷新  ·  数据源 状态观测/latest.json";
  renderAlarms(data);
  renderMatrix(data);
  renderRes(data);
  renderCost(data);
}

fetch("./data.json?t=" + Date.now())
  .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
  .then(render)
  .catch(function (e) {
    el("head").textContent = "";
    el("alarms").textContent = "";
    el("alarms").appendChild(h("span", "lamp amber", "数据尚未生成或不可读"));
    el("alarms").appendChild(h("div", "dim", String(e) + " —— 等待 watchdog 首轮写出 data.json（30s 后自动重试）"));
  });
</script>
</body>
</html>
